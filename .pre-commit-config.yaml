repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # https://github.com/pre-commit/pre-commit-hooks/releases/tag/v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: ^nix/.*\.nix$

      - id: sops-encrypted
        name: sops-encrypted (*.enc* must be ciphertext)
        entry: scripts/check-sops-encrypted.sh
        language: system
        files: (\.enc$|\.enc\.(ya?ml|json)$)

      - id: no-plaintext-k8s-secret
        name: "no plaintext kind: Secret"
        entry: scripts/check-plaintext-k8s-secret.sh
        language: system
        files: ^kube/.*\.ya?ml$
        exclude: \.enc\.ya?ml$
