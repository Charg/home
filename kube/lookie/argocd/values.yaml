# https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml

global:
  domain: argo.packet.fail
  # chart 10.0.0 flips this default to true; lookie has no NetworkPolicies today
  # and k3s enforces them via its embedded controller, so pin it off explicitly
  # until network policies are adopted deliberately.
  networkPolicy:
    create: false
configs:
  params:
    server.insecure: true
  repositories:
    home-repo:
      url: https://github.com/Charg/home.git
  cmp:
    create: true
    plugins:
      sops:
        generate:
          command: [sh, -c]
          args:
            - |
                set -euo pipefail

                first=true
                for f in $(find . -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.yml" \) | sort); do
                  # Print YAML separator if not the first document
                  if [ "$first" = false ]; then
                    echo "---"
                  fi

                  if echo "$f" | grep -qE "\.enc\.ya?ml$"; then
                    if ! sops --decrypt "$f"; then
                      echo "Error: Failed to decrypt $f" >&2
                      exit 1
                    fi
                  else
                    cat "$f"
                  fi
                  first=false
                done
        discover:
          find:
            glob: "**/*.enc.yaml"
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  initContainers:
    - name: download-sops
      image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      command: [sh, -c]
      args:
        - |
          set -e
          # Hashes come from sops-${SOPS_VERSION}.checksums.txt
          # on the GitHub release; bump the version and both hashes together.
          SOPS_VERSION=v3.12.2
          case "$(uname -m)" in
            x86_64)  ARCH=amd64; SHA256=14e2e1ba3bef31e74b70cf0b674f6443c80f6c5f3df15d05ffc57c34851b4998 ;;
            aarch64) ARCH=arm64; SHA256=f66de6f528dca946e910d74fa36a62a7714c11d0db16bd3c9bd8acf73b66704b ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          wget -qO /custom-tools/sops.tmp "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.${ARCH}"
          echo "${SHA256}  /custom-tools/sops.tmp" | sha256sum -c -
          chmod +x /custom-tools/sops.tmp
          mv /custom-tools/sops.tmp /custom-tools/sops
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  extraContainers:
    - name: sops-cmp
      command: [/var/run/argocd/argocd-cmp-server]
      image: quay.io/argoproj/argocd:v3.5.2@sha256:e2aadfae709d904e87f46ba4aa49601d827b3022db22cd4d03aae816a2e7097b
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops/age/key.txt
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: sops.yaml
          name: argocd-cmp-cm
        - mountPath: /tmp
          name: cmp-tmp
        - mountPath: /usr/local/bin/sops
          name: custom-tools
          subPath: sops
        - mountPath: /sops/age
          name: sops-age-key
          readOnly: true
  volumes:
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    - name: custom-tools
      emptyDir: {}
    - name: cmp-tmp
      emptyDir: {}
    - name: sops-age-key
      secret:
        secretName: sops-age-key
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt-packet-fail
      external-dns.alpha.kubernetes.io/hostname: argo.packet.fail
    ingressClassName: traefik-internal
    tls: true
