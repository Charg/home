---
# Cluster plumbing. New chart registries are added here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    # Projects must exist before the Applications that reference them.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster infrastructure
  sourceRepos:
    - https://github.com/Charg/home.git
    - https://github.com/SynologyOpenSource/synology-csi.git
    - registry.k8s.io/nfd/charts
    - https://angelnu.github.io/helm-charts/
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://intel.github.io/helm-charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://metallb.github.io/metallb
    - https://project-akri.github.io/akri/
    - https://traefik.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
