---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbit-neo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Charg/home.git
    path: kube/lookie/qbit-neo
    targetRevision: main
    # Required: the directory holds *.enc.yaml, so it must go through lookie's
    # SOPS CMP (kube/lookie/argocd/values.yaml) rather than plain directory
    # rendering.
    plugin: {}
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
