---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: argocd
            repoURL: https://argoproj.github.io/argo-helm
            chart: argo-cd
            targetRevision: 10.5.0
            namespace: argocd
          - name: home-assistant
            repoURL: http://pajikos.github.io/home-assistant-helm-chart/
            chart: home-assistant
            targetRevision: 0.3.78
            namespace: default
            serverSideDiff: true
          - name: akri
            repoURL: https://project-akri.github.io/akri/
            chart: akri
            targetRevision: 0.13.8
            namespace: default
            serverSideDiff: true
          - name: plex
            repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
            chart: plex-media-server
            targetRevision: 1.7.1
            namespace: default
            serverSideDiff: true
          - name: metallb
            repoURL: https://metallb.github.io/metallb
            chart: metallb
            targetRevision: 0.16.1
            namespace: default
          - name: technitium-dnsserver
            repoURL: https://charts.obeone.cloud
            chart: technitium-dnsserver
            targetRevision: 1.13.0
            namespace: default
          - name: traefik-internal
            repoURL: https://traefik.github.io/charts
            chart: traefik
            targetRevision: 41.4.0
            namespace: traefik-internal
          - name: traefik-public
            repoURL: https://traefik.github.io/charts
            chart: traefik
            targetRevision: 41.4.0
            namespace: traefik-public
            helm_skip_crds: true
          - name: external-dns
            repoURL: https://kubernetes-sigs.github.io/external-dns/
            chart: external-dns
            targetRevision: 1.21.1
            namespace: external-dns
          - name: intel-operator
            repoURL: https://intel.github.io/helm-charts
            chart: intel-device-plugins-operator
            targetRevision: 0.36.0
            namespace: intel-operator
          - name: intel-operator-gpu
            repoURL: https://intel.github.io/helm-charts
            chart: intel-device-plugins-gpu
            targetRevision: 0.36.0
            namespace: intel-operator
          - name: node-feature-discovery
            repoURL: registry.k8s.io/nfd/charts
            chart: node-feature-discovery
            targetRevision: 0.18.3
            namespace: node-feature-discovery
          - name: cert-manager
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            targetRevision: v1.21.1
            namespace: cert-manager
          # A MAJOR bump here is not a Renovate merge: this repo carries a
          # hand-maintained copy of the chart's MutatingWebhookConfiguration in
          # kube/lookie/pod-gateway-config/, which has to be diffed against the
          # upstream template by hand.
          - name: pod-gateway
            repoURL: https://angelnu.github.io/helm-charts/
            chart: pod-gateway
            targetRevision: 7.1.1
            namespace: pod-gateway
            respectIgnoreDifferences: true
            # cainjector writes this field. Without the exception Argo flaps
            # OutOfSync and selfHeal fights cainjector indefinitely.
            ignoreDifferences:
              - group: admissionregistration.k8s.io
                kind: MutatingWebhookConfiguration
                jqPathExpressions:
                  - .webhooks[].clientConfig.caBundle
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      destination:
        namespace: "{{ .namespace }}"
        server: https://kubernetes.default.svc
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            valueFiles:
              - "$values/kube/lookie/{{ .name }}/values.yaml"
        - repoURL: https://github.com/Charg/home.git
          targetRevision: main
          ref: values
  templatePatch: |
    spec:
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            skipCrds: {{ dig "helm_skip_crds" "false" . }}
            valueFiles:
              - "$values/kube/lookie/{{ .name }}/values.yaml"
        - repoURL: https://github.com/Charg/home.git
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          enabled: {{ dig "auto_sync" "true" . }}
          prune: {{ dig "prune" "true" . }}
          selfHeal: {{ dig "selfHeal" "true" . }}
        syncOptions:
          - CreateNamespace={{ dig "createNamespace" "true" . }}
          - ServerSideApply={{ dig "serverSideApply" "true" . }}
          # Opt-in per app. Diffing via a server-side dry-run apply is what
          # makes API-server defaults and dropped fields stop reading as drift,
          # but it also surfaces a rejected apply as an error rather than a
          # quiet OutOfSync, so enable it only where the apply is known to hold.
          - ServerSideDiff={{ dig "serverSideDiff" "false" . }}
          - RespectIgnoreDifferences={{ dig "respectIgnoreDifferences" "false" . }}
      {{- with dig "ignoreDifferences" (list) . }}
      ignoreDifferences:
      {{- toYaml . | nindent 6 }}
      {{- end }}
