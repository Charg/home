---
apiVersion: v1
kind: Service
metadata:
  name: qbit-neo
  namespace: default
  labels:
    app.kubernetes.io/instance: qbit-neo
    app.kubernetes.io/name: qbit-neo
spec:
  # No pinned clusterIP. prowlarr's Service pins one only because the legacy
  # qbittorrent instance allowlists that address in its own VPN firewall;
  # nothing allowlists this app, so let the cluster assign.
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: qbit-neo
    app.kubernetes.io/name: qbit-neo
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
