---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbit-neo
  namespace: default
  labels:
    app.kubernetes.io/name: qbit-neo
    app.kubernetes.io/instance: qbit-neo
    app.kubernetes.io/version: 5.2.3
spec:
  replicas: 0
  serviceName: qbit-neo
  selector:
    matchLabels:
      app.kubernetes.io/name: qbit-neo
      app.kubernetes.io/instance: qbit-neo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbit-neo
        app.kubernetes.io/instance: qbit-neo
    spec:
      automountServiceAccountToken: false
      # gluetun's wireguard needs this.
      # The pod is unschedulable without that node-level setting.
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      # Points at the in-pod CoreDNS sidecar, which splits cluster names to
      # kube-dns and everything else to DoT over the tunnel. gluetun is
      # configured (DNS_KEEP_NAMESERVER=on) to leave this alone rather than
      # rewriting the pod-shared /etc/resolv.conf out from under it.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
        searches:
          - default.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - { name: ndots, value: "5" }
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: config-seed          # ordinary init container: runs to completion
          image: docker.io/library/busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: [sh, -c]
          args:
            - |
              set -eu
              mkdir -p /config/qBittorrent
              cp -f /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf
          volumeMounts:
            - { name: media, mountPath: /config, subPath: qbit-neo-config }
            - { name: config-seed, mountPath: /seed, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
        # NATIVE SIDECAR, listed before gluetun on purpose: sidecars start in
        # list order, so the resolver is up before gluetun makes its first
        # lookup. gluetun's own health check targets an IP, not a name, so it
        # never waits on this - there is no circular wait.
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
          restartPolicy: Always
          args: ["-conf", "/etc/coredns/Corefile"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # 53 is a privileged port and this image's binary carries no file
              # capabilities, so dropping ALL without re-adding this makes the
              # container fail at exec time ("operation not permitted") rather
              # than log a warning.
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - { name: coredns-config, mountPath: /etc/coredns, readOnly: true }
          # NO PROBE ON PURPOSE, and it must stay that way unless something
          # changes below. Every probe kind is unusable here:
          #   - tcpSocket/httpGet are dialled by kubelet from the NODE, at the
          #     pod IP. This resolver binds 127.0.0.1 only, so they can never
          #     connect - the same reason gluetun's probe is an exec, one
          #     container down.
          #   - exec has nothing to run: the image ships only the /coredns
          #     binary, no shell, no dig, no nslookup.
          # A startupProbe that can never pass is worse than none at all: on a
          # native sidecar it does not degrade the pod, it wedges it in Init
          # forever, because the containers after it never start.
          #
          # Nothing actually races on this. gluetun reaches its servers by IP
          # and health-checks an IP, so it needs no resolver; qBittorrent, which
          # does, only starts once gluetun's own probe has passed - by which
          # point CoreDNS has been listening for minutes.
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: gluetun              # NATIVE SIDECAR - restartPolicy makes it one
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          env:
            # The image defaults these to 1000, and gluetun chowns every file it
            # writes to them. This container runs as root with all capabilities
            # dropped, so it has no CAP_CHOWN and the chown fails - which is
            # fatal to the port forwarding service, not cosmetic: it writes the
            # port file, fails to chown it, and then deletes it again. Setting
            # them to the uid this container already runs as makes the chown a
            # no-op, which the kernel allows an owner to perform unprivileged.
            # Root ownership is also what we want here - qBittorrent reads the
            # file as uid 0.
            - { name: PUID, value: "0" }
            - { name: PGID, value: "0" }
            - { name: VPN_SERVICE_PROVIDER, value: protonvpn }
            - { name: VPN_TYPE, value: wireguard }
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: qbit-neo-wireguard, key: privatekey }
            - { name: SERVER_COUNTRIES, value: "Switzerland" }
            # gluetun names the tunnel tun0 by default. The seeded qBittorrent
            # config binds its sockets to wg0, and qBittorrent treats a missing
            # interface as "no binding" rather than an error - it logs "The
            # configured network interface is invalid" and carries on listening
            # anyway, which silently removes the leak containment. Renaming the
            # interface here keeps the two in agreement.
            - { name: VPN_INTERFACE, value: wg0 }
            # WebUI must be reachable from Traefik and other pods; gluetun's
            # firewall DROPs inbound otherwise.
            - { name: FIREWALL_INPUT_PORTS, value: "8080" }
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "10.42.0.0/16,10.43.0.0/16,192.168.74.0/24" }
            # Loopback-only: the control server exposes tunnel control with no
            # auth, and it binds wildcard by default.
            - { name: HTTP_CONTROL_SERVER_ADDRESS, value: "127.0.0.1:8000" }
            # An IP, not a hostname. A name here would make the tunnel's health
            # check wait on a resolver that is itself waiting on the tunnel.
            - { name: HEALTH_TARGET_ADDRESSES, value: "1.1.1.1:443" }
            # Built-in resolver off: it binds wildcard :53 regardless of
            # DNS_ADDRESS and would collide with the CoreDNS sidecar.
            - { name: DNS_SERVER, value: "off" }
            # DNS_KEEP_NAMESERVER, not DNS_ADDRESS. gluetun refuses to point
            # /etc/resolv.conf at a loopback address when its own forwarder is
            # off - it treats that as a black hole and silently substitutes its
            # bootstrap upstream (verified: DNS_ADDRESS=127.0.0.1 produced
            # "nameserver 1.1.1.1"). Since /etc/resolv.conf is shared by every
            # container in the pod, that would drag qBittorrent off the
            # split-horizon resolver too. Keeping the nameserver instead leaves
            # dnsConfig's 127.0.0.1 in place.
            #
            # gluetun logs a scary warning here about keeping container
            # nameservers leaking DNS outside the VPN. It does not apply: the
            # nameserver being kept is 127.0.0.1, the in-pod CoreDNS sidecar,
            # whose public upstream is DoT over this tunnel. Do not "fix" it.
            - { name: DNS_KEEP_NAMESERVER, value: "on" }
            - { name: VPN_PORT_FORWARDING, value: "on" }
            - { name: VPN_PORT_FORWARDING_PROVIDER, value: protonvpn }
            # Only pick servers that actually support forwarding, otherwise
            # server selection can land somewhere NAT-PMP is refused.
            - { name: PORT_FORWARD_ONLY, value: "on" }
            - { name: VPN_PORT_FORWARDING_STATUS_FILE, value: /gluetun/forwarded_port }
            # gluetun splits this shell-style and then exec's it directly -
            # there is no shell in between, so the interpreter has to be named
            # explicitly rather than relying on the script's shebang.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: "/bin/sh /wrapper/port-up.sh {{PORTS}}"
            - { name: TZ, value: America/Los_Angeles }
          # startupProbe, NOT readinessProbe: Kubernetes gates the next
          # container on a sidecar having *started*, so a readinessProbe here
          # would hold nothing back - and it would also feed pod readiness, so
          # a tunnel blip would pull the Service endpoint out from under
          # Traefik. exec, not httpGet: gluetun's health server binds
          # 127.0.0.1:9999 and kubelet sends httpGet probes to the pod IP,
          # which would never reach it.
          startupProbe:
            exec:
              command: [/gluetun-entrypoint, healthcheck]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 36        # 3 minutes to first handshake
          volumeMounts:
            - { name: gluetun-run, mountPath: /gluetun }
            # gluetun creates this directory itself, without an owner-execute
            # bit, and then cannot open the files it puts inside. Root would
            # normally ignore that, but only via CAP_DAC_OVERRIDE, which is
            # dropped here. Letting kubelet create the directory instead sizes
            # the fix to the problem - no extra capability.
            - { name: gluetun-tmp, mountPath: /tmp/gluetun }
            - { name: scripts, mountPath: /wrapper, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
      containers:
        - name: qbittorrent
          image: ghcr.io/home-operations/qbittorrent:5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
          securityContext:
            # The image defaults to uid 65534, but the shared plex-media tree
            # is root-owned, so this has to be uid 0 to write to it.
            # Root here is bounded: every capability
            # is dropped and privilege escalation is off. Only gluetun holds
            # NET_ADMIN, and nothing in this pod is privileged.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Wraps the image's own entrypoint to resolve the forwarded port
          # before qBittorrent launches - the hook cannot do it on a cold start,
          # because it fires before this container exists.
          command: [/bin/sh, /wrapper/port-seed.sh]
          env:
            - { name: TZ, value: America/Los_Angeles }
            - { name: UMASK, value: "0" }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          volumeMounts:
            - { name: media, mountPath: /config, subPath: qbit-neo-config }
            - { name: media, mountPath: /data }
            - { name: gluetun-run, mountPath: /gluetun, readOnly: true }
            - { name: scripts, mountPath: /wrapper, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
            # port-seed.sh waits up to 60s for the forwarded port before
            # launching qBittorrent, so allow for that rather than flapping.
            failureThreshold: 12
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            # No CPU limit on purpose: throttling this container wrecks throughput.
            limits: { memory: 4Gi }
        # Enforces the two share-limit policies qBittorrent cannot express
        # itself - see share-limits.sh. An ordinary container, not a native
        # sidecar: nothing starts after it, and it should not gate anything.
        #
        # Reuses the qBittorrent image rather than adding a fifth one to track.
        # It already carries curl, jq and find, and gluetun DROPs outbound to
        # everything but the LAN, so a slimmer base could not install them at
        # runtime anyway. It talks to the WebUI over loopback in this pod's own
        # network namespace, so it needs no credentials and no port.
        - name: share-limits
          image: ghcr.io/home-operations/qbittorrent:5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
          securityContext:
            # uid 0 for the same reason as qBittorrent, and specifically so the
            # hardlink test can traverse the whole root-owned tree. A directory
            # this container cannot read looks identical to "never imported",
            # which after the grace period means deleting content - so a
            # permissions gap here fails toward data loss, not toward safety.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: [/bin/sh, /wrapper/share-limits.sh]
          env:
            - { name: TZ, value: America/Los_Angeles }
            # Logs what it would do and changes nothing. Watch a full cycle of
            # real downloads in the log before turning this off - the import
            # test is inferred from hardlink counts, not read out of Scryer.
            - { name: DRY_RUN, value: "true" }
          volumeMounts:
            # No subPath: the hardlink test has to see both /data/downloads and
            # the library trees it links into, and a link count is only
            # meaningful across the whole filesystem.
            - { name: media, mountPath: /data }
            - { name: scripts, mountPath: /wrapper, readOnly: true }
          # No probe: this is a loop with nothing listening, and its being down
          # must not affect pod readiness or pull the WebUI out of the Service.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: plex-media
        - name: config-seed
          secret:
            secretName: qbit-neo-config-file
        - name: coredns-config
          configMap:
            name: qbit-neo-coredns
        # Carries gluetun's forwarded_port status file to qBittorrent. emptyDir,
        # not the PVC: the mapping is valid only for the life of this tunnel, so
        # persisting it across restarts would seed a stale port.
        - name: gluetun-run
          emptyDir: {}
        - name: gluetun-tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: qbit-neo-scripts
            defaultMode: 0755
