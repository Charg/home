---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
  namespace: default
  labels:
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/version: 4.6.0-1-01
spec:
  replicas: 1
  serviceName: ""
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: qbittorrent
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/name: qbittorrent
    spec:
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      # NOTE: init-wireguard's command list has a 4th element
      # ("&& if [ -f ... ]; then ... fi") left over from a past edit. With
      # `sh -c script $0`, that 4th element becomes the positional parameter
      # $0 inside the script, not additional shell input — it never executes.
      # The real qBittorrent.conf seed copy happens in init-qbittorrent below.
      # Preserved verbatim (harmless dead code) rather than "fixed" here, so
      # this manifest is a byte-for-byte no-op adoption of the live Helm
      # release. Clean this up in a separate, deliberate change.
      initContainers:
        - name: init-wireguard
          image: busybox:1.35
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /config/wireguard && cp -f /wireguard-config/wg0.conf /config/wireguard/
            - '&& if [ -f "/qbittorrent-config/qBittorrent.conf" ]; then mkdir -p /config/qBittorrent/config/ && cp -f /qbittorrent-config/qBittorrent.conf /config/qBittorrent/config/; fi'
          volumeMounts:
            - name: qbittorrent
              mountPath: /config
              subPath: qbittorrent-config
            - name: wireguard-config
              mountPath: /wireguard-config
              readOnly: true
            - name: qbittorrent-config-file
              mountPath: /qbittorrent-config
              readOnly: true
          resources: {}
        - name: init-qbittorrent
          image: busybox:1.35
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /config/qBittorrent/config/ && cp -f /qbittorrent-config/qBittorrent.conf /config/qBittorrent/config/
          volumeMounts:
            - name: qbittorrent
              mountPath: /config
              subPath: qbittorrent-config
            - name: qbittorrent-config-file
              mountPath: /qbittorrent-config
              readOnly: true
          resources: {}
      containers:
        - name: qbittorrent
          image: binhex/arch-qbittorrentvpn:4.6.3-1-02
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: UMASK
              value: "0"
            - name: VPN_ENABLED
              value: "true"
            - name: VPN_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secret
                  key: vpn_user
            - name: VPN_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-secret
                  key: vpn_pass
            - name: VPN_PROV
              value: protonvpn
            - name: VPN_CLIENT
              value: wireguard
            - name: LAN_NETWORK
              value: 10.42.0.0/24,10.43.0.0/16
            - name: NAME_SERVERS
              value: 1.1.1.1
            - name: STRICT_PORT_FORWARD
              value: "false"
            - name: ENABLE_PRIVOXY
              value: "false"
            - name: WEBUI_PORT
              value: "8080"
            - name: DEBUG
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: qbittorrent
              mountPath: /config
              subPath: qbittorrent-config
            - name: qbittorrent
              mountPath: /data
          # Live release has no resource requests/limits. Left empty here so
          # this manifest is a true no-op adoption of the running StatefulSet
          # (adding requests/limits forces a rollout). Set requests/limits in
          # a separate, deliberate follow-up commit once adoption is verified.
          resources: {}
      volumes:
        - name: wireguard-config
          secret:
            secretName: qbittorrent-wireguard
            defaultMode: 420
        - name: qbittorrent-config-file
          secret:
            secretName: qbittorrent-config-file
            defaultMode: 420
        - name: qbittorrent
          persistentVolumeClaim:
            claimName: plex-media
