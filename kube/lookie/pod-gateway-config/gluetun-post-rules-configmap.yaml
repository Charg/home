---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-gateway-iptables
  namespace: pod-gateway
data:
  # Mounted at /iptables in the gluetun container. gluetun replays this file at
  # the end of EVERY firewall enable (runUserPostRules in
  # internal/firewall/enable.go), which is the only hook that survives a
  # single-container restart.
  #
  # Why this file exists at all: gateway_init.sh is a true init container, so it
  # does not re-run when only the gluetun container restarts. gluetun's
  # disable() calls clearAllRules, which is `iptables --flush --delete-chain`
  # WITHOUT `-t nat` - so the MASQUERADE survives but every filter-table rule
  # gateway_init.sh added is gone. gluetun then re-asserts FORWARD DROP on the
  # way back up with nothing left to match it. The symptom is a Running pod with
  # wg0 up and every routed client silently offline.
  #
  # runIptablesInstruction just splits fields and execs, so `-t nat` is accepted
  # here despite the file being named post-rules. The MASQUERADE line is
  # idempotent-unsafe (a repeat enable appends a duplicate) but harmless: a
  # second identical MASQUERADE rule never matches, because the first already
  # did.
  #
  # If a future gluetun rejects `-t nat` here, the fallback is operational, not
  # a code change: clients lost egress but the gateway pod is Running -> delete
  # the gateway pod. See README.md.
  post-rules.txt: |
    iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE
    iptables -I FORWARD -o wg0 -j ACCEPT
    iptables -A FORWARD -i wg0 -m state --state ESTABLISHED,RELATED -j ACCEPT
    iptables -A INPUT -i eth0 -p udp --dport 4789 -j ACCEPT
    iptables -A INPUT -i vxlan0 -p udp --sport 68 --dport 67 -j ACCEPT
    iptables -A OUTPUT -o vxlan0 -j ACCEPT
