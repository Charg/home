---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: default
  labels:
    app.kubernetes.io/name: trawl
spec:
  replicas: 1
  # The browser pool (~1-2GB warm) makes a second live pod expensive for no
  # availability benefit on a single-node cluster - recreate instead of roll.
  strategy:
    type: Recreate
  # NOT the place for setGateway - a Deployment's selector is immutable, and a
  # routing flag has no business being part of this workload's identity.
  selector:
    matchLabels:
      app.kubernetes.io/name: trawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trawl
        # Routes all non-cluster egress through the WireGuard gateway, so
        # tracker pages load from the tunnel's exit rather than the house
        # connection. See kube/lookie/pod-gateway-config/README.md, and this
        # directory's README for the ordering trap it introduces here.
        setGateway: "true"
    spec:
      automountServiceAccountToken: false
      # Native sidecar (restartPolicy: Always init container, GA since 1.29).
      #
      # The gate is the startupProbe, NOT a readinessProbe. Kubelet moves on to
      # the next container once a restartable init container has *started* and,
      # if a startupProbe is defined, once that probe succeeds - readiness does
      # not participate. Verified directly: a sidecar whose readinessProbe can
      # never pass still lets the next container start and log, while the same
      # sidecar with a startupProbe that can never pass leaves the pod in
      # PodInitializing. kube/lookie/qbit-neo/README.md records the same finding.
      #
      # The gate matters because Redis 8 bundles Bloom/Search/TimeSeries/ReJSON
      # modules that take ~1.5-2s to load before it accepts connections - long
      # enough to blow past trawl's 1000ms startup Redis-connect timeout when
      # both containers start in parallel, permanently disabling Tier 2 cache
      # for the pod's lifetime (trawl doesn't retry after the initial check).
      #
      # No readinessProbe here on purpose: on a native sidecar it feeds POD
      # readiness, so a redis blip would pull trawl's endpoint out from under
      # Traefik for a cache tier that is only a performance concern.
      initContainers:
        - name: redis
          image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
          restartPolicy: Always
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["redis-cli", "-h", "localhost", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 2
            # 10 x 2s past the 1s delay - generous against the module load, and
            # a failure here holds the pod in PodInitializing rather than
            # starting trawl against a Redis that isn't listening yet.
            failureThreshold: 10
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:1.4.0@sha256:b8d81faa832f0417dbdeb2684c395a8405fb85739bbb89b19c019cdc3131814c
          env:
            - name: BROWSER_POOL_SIZE
              value: "2"
            - name: BROWSER_CONTENT_PROCESSES
              value: "2"
            - name: TZ
              value: America/Los_Angeles
            # REDIS_URL intentionally unset: the default (redis://localhost:6379)
            # already points at the sidecar below.
            #
            # MITM_PROXY_ENABLED intentionally unset (defaults to "false"). Scryer's
            # only solver transport is POST <base_url>/v1 - it has no HTTP forward-proxy
            # concept and no hook to install Trawl's CA - so the MITM proxy (:8192)
            # would be dead weight here. See kube/lookie/trawl/README.md.
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          # /health returns 503 while the browser pool warms up (15-30s typical,
          # up to 90s) - fine for readiness, wrong for liveness.
          readinessProbe:
            httpGet:
              path: /health
              port: 8191
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          # / only confirms the API process is up and does not wait on the pool,
          # so a transient pool stall can't restart-loop the pod.
          livenessProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 120
            periodSeconds: 20
      volumes:
        # Replicates upstream's mandatory `shm_size: 1gb` - Firefox needs far more
        # than Kubernetes' 64Mi default /dev/shm.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # Pure session cache (30min TTL); losing it on pod restart is a
        # performance hit, not a correctness issue.
        - name: redis-data
          emptyDir: {}
