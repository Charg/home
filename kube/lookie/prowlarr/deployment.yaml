---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: default
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  # SQLite (prowlarr.db) on a RWO volume must never have two writers at once -
  # same constraint as Scryer, see kube/lookie/scryer/deployment.yaml.
  strategy:
    type: Recreate
  # NOT the place for setGateway - a Deployment's selector is immutable, and a
  # routing flag has no business being part of this workload's identity.
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
        # Routes all non-cluster egress through the WireGuard gateway. The
        # admission webhook appends two injected containers on the strength of
        # this label, and networkpolicy-routed.yaml in kube/lookie/pod-gateway-config
        # fences the pod on the strength of the same one. Only "true"/"false"
        # are safe values - see that directory's README.
        setGateway: "true"
    spec:
      automountServiceAccountToken: false
      # home-operations' image runs as a fixed uid/gid 1000, rootless - unlike
      # qbittorrent/scryer this app never touches the shared plex-media volume,
      # so there's no reason to run it as root. See README.md.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prowlarr
          image: ghcr.io/home-operations/prowlarr:2.6.5.5623@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: America/Los_Angeles
            # Pinned so the Torznab URLs configured in Scryer survive a
            # /config rebuild - a regenerated key would silently break every
            # Scryer indexer at once. See README.md.
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-api-key
                  key: api-key
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # /ping is unauthenticated and dependency-free (AllowAnonymous),
          # unlike the rest of the API which needs the API key.
          readinessProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config-local
