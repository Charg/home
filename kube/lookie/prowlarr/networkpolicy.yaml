---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 9696
    # Scryer pulls the Torznab feeds. That flow is in the pod range, so it is in
    # NOT_ROUTED_TO_GATEWAY_CIDRS and travels the normal path - ordinary
    # podSelector rules keep working on it exactly as before.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scryer
      ports:
        - protocol: TCP
          port: 9696
    # THE GATEWAY INGRESS RULE, and it is not optional. VXLAN return traffic is a
    # separate conntrack flow, not a reply: the client sends
    # (clientIP:hash -> gatewayIP:4789) and the gateway sends
    # (gatewayIP:hash -> clientIP:4789). Different five-tuples, so a
    # RELATED,ESTABLISHED accept does not cover it.
    #
    # Omit this and the injected init container PASSES its ICMP ping to the
    # gateway - that has a real reply - and then hangs on udhcpc. The symptom
    # points at DHCP; the cause is here. No ports: restriction, because it has to
    # carry ICMP as well as the VXLAN.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pod-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pod-gateway
              app.kubernetes.io/controller: main
  egress:
    # client_init.sh resolves the gateway by name before the tunnel exists, and
    # Prowlarr resolves in-cluster names through kube-dns as usual.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Trawl's FlareSolverr-compatible endpoint, used as an indexer proxy for
    # trackers behind a challenge.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trawl
      ports:
        - protocol: TCP
          port: 8191
    # Egress to the gateway itself. Duplicated from
    # kube/lookie/pod-gateway-config/networkpolicy-routed.yaml on purpose:
    # NetworkPolicies are additive, and once this pod has an Egress policy of its
    # own, deleting the backstop no longer restores anything here.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pod-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pod-gateway
              app.kubernetes.io/controller: main
    # No internet destinations, deliberately. Everything Prowlarr reaches outside
    # the cluster now travels inside the VXLAN, so kube-router only ever sees the
    # outer UDP packet to the gateway. A destination allowlist here would be
    # decorative; the gateway's own firewall is the real control.
