---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryer
  namespace: default
  labels:
    app.kubernetes.io/name: scryer
spec:
  replicas: 1
  # SQLite on a RWO volume must never have two writers at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scryer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scryer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scryer
          image: ghcr.io/scryer-media/scryer:0.19.4@sha256:e16af536abd122acdd172213b4ab8ff3bf873aac923f44cf8d6ffd54d8f5ab8e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: SCRYER_BIND
              value: 0.0.0.0:8080
            # UMASK: matches qbit-neo, so the two agree on what an imported file looks
            # like on the shared tree.
            - name: UMASK
              value: "002"
            - name: TZ
              value: America/Los_Angeles
            - name: SCRYER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: scryer-encryption-key
                  key: encryption-key
            # Seed settings only; inert once changed in the UI.
            - name: SCRYER_MOVIES_PATH
              value: /data/Movies
            - name: SCRYER_SERIES_PATH
              value: /data/TV
            - name: SCRYER_AUTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: scryer-config
              mountPath: /config
            # Same mount path qBittorrent uses for /data - this is what
            # lets Scryer do atomic-move/hardlink imports with zero remote
            # path mapping between the download client and the library.
            - name: plex-media
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: scryer-config
          persistentVolumeClaim:
            claimName: scryer-config
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media
