---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scryer
  namespace: default
  labels:
    app.kubernetes.io/name: scryer
spec:
  replicas: 1
  # SQLite on a RWO volume must never have two writers at once.
  strategy:
    type: Recreate
  # NOT the place for setGateway - a Deployment's selector is immutable, and a
  # routing flag has no business being part of this workload's identity.
  selector:
    matchLabels:
      app.kubernetes.io/name: scryer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scryer
        # Routes all non-cluster egress through the WireGuard gateway. The
        # admission webhook appends two injected containers on the strength of
        # this label, and networkpolicy-routed.yaml in kube/lookie/pod-gateway-config
        # fences the pod on the strength of the same one. Only "true"/"false"
        # are safe values - see that directory's README.
        setGateway: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scryer
          image: ghcr.io/scryer-media/scryer:0.21.4@sha256:7dd150eb17fa258271969876d66af1e7ad70d5a8162e9d73888b682f9512f0c7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: SCRYER_BIND
              value: 0.0.0.0:8080
            - name: UMASK
              value: "002"
            - name: TZ
              value: America/Los_Angeles
            - name: SCRYER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: scryer-encryption-key
                  key: encryption-key
            # Seed settings only; inert once changed in the UI.
            - name: SCRYER_MOVIES_PATH
              value: /data/Movies
            - name: SCRYER_SERIES_PATH
              value: /data/TV
            - name: SCRYER_AUTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: scryer-config
              mountPath: /config
            # Same mount path qBittorrent uses for /data - this is what
            # lets Scryer do atomic-move/hardlink imports with zero remote
            # path mapping between the download client and the library.
            - name: plex-media
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            # CPU limit was 1000m; container_cpu_usage_seconds_total peaked at
            # 0.99 cores with the throttle ratio hitting 97% during a scan/import
            # burst - genuinely CPU-bound, not just blocked on the old iSCSI
            # storage. Memory limit is untouched: peak usage was 541Mi against
            # 2Gi, zero OOM events in 30d.
            limits:
              cpu: 3000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: scryer-config
          persistentVolumeClaim:
            # Node-local (see pvc.yaml): SQLite fsyncs every write transaction,
            # and synology-iscsi-storage put a network round-trip behind each
            # one. Migrated from scryer-config (retained, not deleted, so it
            # still holds a pre-migration copy of /config).
            claimName: scryer-config-local
        - name: plex-media
          persistentVolumeClaim:
            claimName: plex-media
