# source: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik-internal

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-internal
    # Ingresses in any namespace may reference the forward-auth middleware
    # in auth (kube/nuc01/tinyauth) without a copy per namespace.
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-internal

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

metrics:
  prometheus:
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Two pods on separate nodes; the LB address only routes to the node that
# holds a ready pod, so no SNAT and apps see the real client address.
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-internal-traefik-internal
        topologyKey: kubernetes.io/hostname

service:
  spec:
    externalTrafficPolicy: Local
  annotations:
    external-dns.kubernetes.io/hostname: traefik.home.packet.fail

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["websecure"]
    matchRule: Host(`traefik.home.packet.fail`)
    middlewares:
      - name: tinyauth
        namespace: auth
    tls: {}

tlsStore:
  default:
    defaultCertificate:
      secretName: home-packet-fail-wildcard-tls
