# source: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik-internal

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-internal
    # Ingresses in any namespace may reference the forward-auth middleware
    # in auth (kube/nuc01/tinyauth) without a copy per namespace.
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-internal

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

service:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: traefik.home.packet.fail

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["websecure"]
    matchRule: Host(`traefik.home.packet.fail`)
    middlewares:
      - name: tinyauth
        namespace: auth
    tls: {}

tlsStore:
  default:
    defaultCertificate:
      secretName: home-packet-fail-wildcard-tls
