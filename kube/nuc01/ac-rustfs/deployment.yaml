---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-rustfs
  namespace: ac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ac-rustfs
  template:
    metadata:
      labels:
        app: ac-rustfs
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          ports:
            - containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
            - name: RUSTFS_OBS_ENDPOINT
              value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
            - name: RUSTFS_OBS_SERVICE_NAME
              value: "ac-rustfs"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            # Loopback only; reach it with kubectl port-forward when needed.
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "127.0.0.1:9001"
            # The default scanner preset restarts a full metadata walk 60s
            # after the previous one finishes, so on a large bucket it never
            # stops and saturates nuc01's NVMe with reads. This store is low
            # use, so scan weekly, as slowly as possible, and skip the
            # bitrot deep scan (single drive, no parity to heal from anyway).
            - name: RUSTFS_SCANNER_SPEED
              value: "slowest"
            - name: RUSTFS_SCANNER_CYCLE
              value: "604800"
            - name: RUSTFS_SCANNER_START_DELAY_SECS
              value: "3600"
            - name: RUSTFS_SCANNER_BITROT_CYCLE_SECS
              value: "off"
          # The image already runs as its own user; make that explicit and
          # take away everything else.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
