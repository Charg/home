# Every environment variable the openveto workloads read, in one Opaque secret
# the chart mounts wholesale via envFrom. Keys map one to one onto variable
# names, and the SOPS rule for this tree encrypts only the stringData values —
# so the key list stays reviewable in git while the values do not.
#
# DJANGO_ALLOWED_HOSTS must keep `localhost`: the probes address the pod by IP
# with an explicit `Host: localhost` header, and Django does not allow it
# implicitly once debug is off, so dropping it leaves every pod unready.
#
# DATABASE_URL targets the connection pooler rather than the cluster's
# read-write service, so the workloads share a bounded pool of server
# connections instead of opening one per process.
#
# The object store appears twice on purpose: the endpoint is the in-cluster
# service the app writes through, while the custom domain is the read-only
# proxy hostname it puts in generated URLs. They are different values.
#
# No Sentry DSN: alerting rides the log pipeline, so the DSN is optional and
# omitted rather than set to an empty string.
#
# TODO: three values are placeholders (`REPLACE_ME`) pending the real upstream
# credentials — SENDGRID_API_KEY, CONGRESS_API_KEY and OPENAI_API_KEY.
