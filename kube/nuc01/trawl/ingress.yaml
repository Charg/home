---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trawl-internal
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/hostname: trawl.home.packet.fail
spec:
  ingressClassName: traefik-internal
  rules:
    - host: trawl.home.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trawl
                port:
                  number: 8191
  tls:
    - hosts:
        - trawl.home.packet.fail
