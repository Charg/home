---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: media
  labels:
    app.kubernetes.io/name: trawl
spec:
  replicas: 1
  # The browser pool is 1-2GB warm; a second pod during a roll buys nothing.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trawl
        # Routes non-cluster egress through the WireGuard gateway. See
        # kube/nuc01/media-config/README.md.
        setGateway: "true"
    spec:
      automountServiceAccountToken: false
      # Native sidecar gated by its startupProbe, so trawl's one-shot Redis
      # connect check never races the module load. See README.md.
      initContainers:
        - name: redis
          image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
          restartPolicy: Always
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["redis-cli", "-h", "localhost", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 10
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:1.4.0@sha256:b8d81faa832f0417dbdeb2684c395a8405fb85739bbb89b19c019cdc3131814c
          env:
            - name: BROWSER_POOL_SIZE
              value: "2"
            - name: BROWSER_CONTENT_PROCESSES
              value: "2"
            - name: TZ
              value: America/Los_Angeles
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
          # Container-level on purpose: the gateway webhook injects containers
          # that set their own context, and a pod-level one would apply to
          # them too. Verified against this image: it comes up healthy as an
          # arbitrary uid with every capability dropped.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          # /health is 503 while the browser pool warms (up to ~90s).
          readinessProbe:
            httpGet:
              path: /health
              port: 8191
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          # / doesn't wait on the pool, so a pool stall can't restart-loop.
          livenessProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 120
            periodSeconds: 20
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: redis-data
          emptyDir: {}
