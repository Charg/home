---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ac-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  instances: 1

  bootstrap:
    initdb:
      owner: ac
      secret:
        name: postgres-credentials

  storage:
    size: 100Gi

  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: ac-postgres-custom-queries
        key: queries.yaml

  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      max_connections: "50"
      max_parallel_workers: "2"
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
      work_mem: "16MB"
      maintenance_work_mem: "512MB"
      max_wal_size: "4GB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      log_min_duration_statement: "250ms"
      log_lock_waits: "on"
      # diagnostics for the repeated OOM kills: bounds autovacuum memory
      # separately from ad-hoc maintenance_work_mem, and logs temp-file
      # spills so a runaway backend is visible before the next kill erases it
      log_temp_files: "0"
      log_autovacuum_min_duration: "0"
      autovacuum_work_mem: "256MB"

  resources:
    requests:
      cpu: 1000m
      memory: 8Gi
    limits:
      cpu: 2000m
      memory: 8Gi
