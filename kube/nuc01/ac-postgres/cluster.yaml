---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ac-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  instances: 1

  bootstrap:
    initdb:
      owner: ac
      secret:
        name: postgres-credentials

  storage:
    size: 100Gi

  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: ac-postgres-custom-queries
        key: queries.yaml

  postgresql:
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      max_connections: "50"
      max_parallel_workers: "2"
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
      work_mem: "16MB"
      maintenance_work_mem: "512MB"
      max_wal_size: "4GB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      log_min_duration_statement: "250ms"
      # log_min_duration_statement only fires when a statement *finishes*, so a
      # statement wedged behind a lock logs nothing at all -- which is how a
      # blocked ALTER TABLE stayed invisible for ten minutes during the accord
      # 0.15.0 migration. This logs the wait itself (after deadlock_timeout,
      # 1s) along with the session holding the lock. Reloadable: log_lock_waits
      # is a superuser/SIGHUP setting, so no restart.
      log_lock_waits: "on"

  resources:
    requests:
      cpu: 1000m
      memory: 8Gi
    limits:
      cpu: 2000m
      memory: 8Gi
