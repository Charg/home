---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ac-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  instances: 1

  bootstrap:
    initdb:
      owner: ac
      secret:
        name: postgres-credentials

  storage:
    size: 100Gi

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      max_connections: "50"
      max_parallel_workers: "2"
      effective_cache_size: "3GB"

  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 500m
      memory: 4Gi
