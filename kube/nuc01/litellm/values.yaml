# source: https://github.com/BerriAI/litellm/tree/main/helm/litellm-helm

db:
  useExisting: true
  deployStandalone: false
  endpoint: litellm-postgres-rw.litellm.svc
  database: litellm
  secret:
    name: postgres-credentials
    usernameKey: username
    passwordKey: password

masterkeySecretName: litellm-masterkey
masterkeySecretKey: masterkey

# Single replica for now, so the bundled Redis (cross-pod rate-limit/cache
# coordination) isn't needed yet - add it if/when we scale replicas.
redis:
  enabled: false

environmentSecrets:
  - litellm-provider-keys

# api_key values are os.environ refs, not literals - this file is read from git
# in the clear, the actual keys live in litellm-config/litellm-provider-keys.enc.yaml.
proxy_config:
  model_list:
    - model_name: gpt-4o
      litellm_params:
        model: openai/gpt-4o
        api_key: os.environ/OPENAI_API_KEY
    # Local models via llama-swap (kube/nuc01/llama-swap) on tortuga's GPU.
    # Unavailable while the node is off; the first request after idle waits
    # for the model to load, hence the long timeout. llama-swap has no auth,
    # but the OpenAI client insists on a key.
    - model_name: gemma-4-12b
      litellm_params: &llama-swap
        model: openai/gemma-4-12b
        api_base: http://llama-swap.ai.svc:8080/v1
        api_key: none
        timeout: 600
    - model_name: gpt-oss-20b
      litellm_params:
        <<: *llama-swap
        model: openai/gpt-oss-20b
    - model_name: qwen3.5-9b
      litellm_params:
        <<: *llama-swap
        model: openai/qwen3.5-9b
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

ingress:
  enabled: true
  className: traefik-internal
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.home.packet.fail
  hosts:
    - host: litellm.home.packet.fail
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - litellm.home.packet.fail

resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: 500m
    memory: 2Gi
