---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: temporal-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  instances: 2
  affinity:
    podAntiAffinityType: required

  bootstrap:
    initdb:
      owner: temporal
      secret:
        name: temporal-postgres-credentials

  storage:
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: temporal-postgres

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 1Gi
