---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: auth
  labels:
    app.kubernetes.io/name: pocket-id
spec:
  replicas: 1
  # SQLite on an RWO volume; never two writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image entrypoint execs straight into the binary when it is not
        # root, so no PUID/PGID dance; fsGroup owns the volume instead.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.19.2@sha256:3ee23895d6a3adb5dd5de801a4fd31fc31b960e6dfbea9b5200e33cf477695eb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Passkeys are bound to this origin; changing it invalidates
            # every enrolled passkey. See README.md.
            - { name: APP_URL, value: "https://id.home.packet.fail" }
            # Client IPs come from X-Forwarded-For set by Traefik, which
            # lives in the pod network.
            - { name: TRUST_PROXY, value: "10.42.0.0/16" }
            - { name: ANALYTICS_DISABLED, value: "true" }
            - { name: VERSION_CHECK_DISABLED, value: "true" }
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: pocket-id-secrets, key: encryption-key }
          ports:
            - { name: http, containerPort: 1411, protocol: TCP }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
