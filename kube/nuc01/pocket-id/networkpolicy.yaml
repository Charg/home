---
# Reached only through the internal ingress. Outbound is DNS and SMTP:
# analytics and the version check are off, and LDAP and logo fetching are
# unused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocket-id
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 1411
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SMTP submission. The server is in the pocket-id-smtp secret, so any
    # destination.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 587
