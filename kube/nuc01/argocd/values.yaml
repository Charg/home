# https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml

global:
  domain: argo-nuc01.packet.fail
configs:
  cm:
    # Child-Application health, used by app-of-apps sync waves.
    #
    # The built-in check mirrors a child's own .status.health.status and
    # nothing else. Hook resources are excluded from Application health, so an
    # app whose only resource is a hook Job reports Healthy the instant it is
    # applied. A wave-1 app that exists purely to run a hook to completion
    # therefore satisfies the gate immediately, and wave 2 starts alongside it
    # rather than after it.
    #
    # Treat an in-flight sync as not-yet-healthy so the wave gate waits for
    # hooks to finish. Caveat: right after a parent patches a child's spec the
    # child still carries its previous status, so a stale Healthy can still be
    # read once — a workload that must not start early should gate itself as
    # well, not lean on wave ordering alone.
    resource.customizations.health.argoproj.io_Application: |
      hs = { status = "Progressing", message = "Waiting for Application" }
      if obj.status == nil then
        return hs
      end
      if obj.status.operationState ~= nil and (obj.status.operationState.phase == "Running" or obj.status.operationState.phase == "Terminating") then
        hs.message = "Sync operation " .. obj.status.operationState.phase
        return hs
      end
      if obj.status.sync ~= nil and obj.status.sync.status ~= "Synced" then
        hs.message = "Application is " .. obj.status.sync.status
        return hs
      end
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      return hs
  params:
    server.insecure: true
  repositories:
    home-repo:
      url: https://github.com/Charg/home.git
  cmp:
    create: true
    plugins:
      sops:
        generate:
          command: [sh, -c]
          args:
            - |
                set -euo pipefail

                first=true
                for f in $(find . -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.yml" \) | sort); do
                  # Print YAML separator if not the first document
                  if [ "$first" = false ]; then
                    echo "---"
                  fi

                  if echo "$f" | grep -qE "\.enc\.ya?ml$"; then
                    if ! sops --decrypt "$f"; then
                      echo "Error: Failed to decrypt $f" >&2
                      exit 1
                    fi
                  else
                    cat "$f"
                  fi
                  first=false
                done
        discover:
          find:
            glob: "**/*.enc.yaml"
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  initContainers:
    - name: download-sops
      image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      command: [sh, -c]
      args:
        - |
          set -e
          SOPS_VERSION=v3.12.2
          ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
          wget -qO /custom-tools/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.${ARCH}"
          chmod +x /custom-tools/sops
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  extraContainers:
    - name: sops-cmp
      command: [/var/run/argocd/argocd-cmp-server]
      image: quay.io/argoproj/argocd:v3.5.2@sha256:e2aadfae709d904e87f46ba4aa49601d827b3022db22cd4d03aae816a2e7097b
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops/age/key.txt
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: sops.yaml
          name: argocd-cmp-cm
        - mountPath: /tmp
          name: cmp-tmp
        - mountPath: /usr/local/bin/sops
          name: custom-tools
          subPath: sops
        - mountPath: /sops/age
          name: sops-age-key
          readOnly: true
  volumes:
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    - name: custom-tools
      emptyDir: {}
    - name: cmp-tmp
      emptyDir: {}
    - name: sops-age-key
      secret:
        secretName: sops-age-key
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt-packet-fail
      external-dns.alpha.kubernetes.io/hostname: argo-nuc01.packet.fail
    ingressClassName: traefik-internal
    tls: true
