---
# DSM runs on the NAS itself, outside the cluster. An ExternalName Service avoids a
# hand-written EndpointSlice, which Argo excludes by default. Needs
# allowExternalNameServices on traefik-internal and cluster DNS resolving home.packet.fail.
apiVersion: v1
kind: Service
metadata:
  name: dsm
spec:
  type: ExternalName
  externalName: synology.home.packet.fail
  ports:
    - name: http
      port: 5000
      protocol: TCP
