---
# The login page and the OAuth callback. Protected apps never route here;
# Traefik calls the service directly through the middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tinyauth-internal
  namespace: auth
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.home.packet.fail
spec:
  ingressClassName: traefik-internal
  rules:
    - host: auth.home.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tinyauth
                port:
                  number: 3000
  tls:
    - hosts:
        - auth.home.packet.fail
