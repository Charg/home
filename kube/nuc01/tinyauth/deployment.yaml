---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyauth
  namespace: auth
  labels:
    app.kubernetes.io/name: tinyauth
spec:
  replicas: 1
  # SQLite sessions on an RWO volume; never two writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tinyauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tinyauth
    spec:
      # No ingress-label ACLs (TINYAUTH_LABELPROVIDER=none), so nothing to read.
      automountServiceAccountToken: false
      securityContext:
        # The image's "tinyauth" user, which owns /data.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tinyauth
          image: ghcr.io/tinyauthapp/tinyauth:v5.2.0@sha256:220aa235c76393a73fece831d7ba967b8698d3907fd8e3c4c952f699c7b142a5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: TINYAUTH_APPURL, value: "https://auth.home.packet.fail" }
            - { name: TINYAUTH_AUTH_SECURECOOKIE, value: "true" }
            # Traefik lives in the pod network; client IPs come from its
            # X-Forwarded-For.
            - { name: TINYAUTH_AUTH_TRUSTEDPROXIES, value: "10.42.0.0/16" }
            # No per-app ACLs; those would need ingress labels and API access
            # to read them.
            - { name: TINYAUTH_LABELPROVIDER, value: "none" }
            - { name: TINYAUTH_ANALYTICS_ENABLED, value: "false" }
            # No local users; the login page goes straight to the IdP.
            - { name: TINYAUTH_OAUTH_AUTOREDIRECT, value: "pocketid" }
            - { name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME, value: "Pocket ID" }
            - { name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL, value: "https://id.home.packet.fail/authorize" }
            - { name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL, value: "https://id.home.packet.fail/api/oidc/token" }
            - { name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL, value: "https://id.home.packet.fail/api/oidc/userinfo" }
            - { name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL, value: "https://auth.home.packet.fail/api/oauth/callback/pocketid" }
            - { name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES, value: "openid email profile groups" }
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
              valueFrom:
                secretKeyRef: { name: tinyauth-secrets, key: oauth-client-id }
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
              valueFrom:
                secretKeyRef: { name: tinyauth-secrets, key: oauth-client-secret }
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tinyauth-data
