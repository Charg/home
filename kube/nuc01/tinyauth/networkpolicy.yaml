---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tinyauth
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tinyauth
  policyTypes:
    - Ingress
    - Egress
  # Traefik is the only caller: the forward-auth check and the ingress.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Token and userinfo calls go to the IdP by its public name, so they
    # enter through the internal ingress. The LoadBalancer IP is DNATed to
    # the Traefik pod before this is evaluated.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
