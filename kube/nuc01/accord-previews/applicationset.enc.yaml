apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
    name: accord-previews
    namespace: argocd
spec:
    goTemplate: true
    goTemplateOptions:
        - missingkey=error
    syncPolicy:
        preserveResourcesOnDeletion: false
    generators:
        - pullRequest:
            github:
                owner: Charg
                repo: accord
                labels:
                    - preview
                tokenRef:
                    secretName: accord-preview-github-token
                    key: token
            requeueAfterSeconds: 120
    template:
        metadata:
            name: accord-pr-{{ .number }}
        spec:
            project: default
            source:
                repoURL: https://github.com/Charg/accord.git
                path: helm/accord
                targetRevision: '{{ .head_sha }}'
                helm:
                    valueFiles:
                        - values-preview.yaml
                    valuesObject:
                        image:
                            tag: pr-{{ .number }}-{{ .head_short_sha }}
                        imagePullSecrets:
                            - name: ghcr-pull-creds
                        preview:
                            enabled: true
                            host: pr-{{ .number }}.accord.packet.fail
                            imagePullSecret:
                                dockerconfigjson: ENC[AES256_GCM,data:,iv:BUVBtiSYKE5OSq9ddfjlyzb8c0hrMdL2j6Ycs7b2zzk=,tag:sq/5RvjdT+aqUeEL00HxnQ==,type:str]
            destination:
                namespace: accord-pr-{{ .number }}
                server: https://kubernetes.default.svc
            syncPolicy:
                automated:
                    prune: true
                    selfHeal: true
                syncOptions:
                    - CreateNamespace=true
                    - ServerSideApply=true
