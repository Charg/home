---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-mysql
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-mysql
spec:
  replicas: 1
  serviceName: fleet-mysql
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          args:
            - --innodb-buffer-pool-size=256M
            # Single instance, no replicas to feed; binlogs would only grow
            # the volume.
            - --disable-log-bin
          env:
            - name: MYSQL_DATABASE
              value: fleet
            - name: MYSQL_USER
              value: fleet
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql-credentials
                  key: root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql-credentials
                  key: mysql-password
          ports:
            - name: mysql
              containerPort: 3306
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Over TCP so it only passes once the real server is up; the
          # first-boot init server listens on the socket only.
          startupProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
