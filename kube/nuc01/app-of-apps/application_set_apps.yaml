---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: argocd
            repoURL: https://argoproj.github.io/argo-helm
            chart: argo-cd
            targetRevision: 10.11.6
            namespace: argocd
          - name: metallb
            repoURL: https://metallb.github.io/metallb
            chart: metallb
            targetRevision: 0.16.1
            namespace: default
          - name: traefik-internal
            repoURL: https://traefik.github.io/charts
            chart: traefik
            targetRevision: 41.7.1
            namespace: traefik-internal
          - name: traefik-public
            repoURL: https://traefik.github.io/charts
            chart: traefik
            targetRevision: 41.7.1
            namespace: traefik-public
            helm_skip_crds: true
          - name: external-dns
            repoURL: https://kubernetes-sigs.github.io/external-dns/
            chart: external-dns
            targetRevision: 1.23.0
            namespace: external-dns
          - name: external-dns-technitium
            repoURL: https://kubernetes-sigs.github.io/external-dns/
            chart: external-dns
            targetRevision: 1.23.0
            namespace: external-dns
          - name: cert-manager
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            targetRevision: v1.21.3
            namespace: cert-manager
          - name: node-feature-discovery
            repoURL: registry.k8s.io/nfd/charts
            chart: node-feature-discovery
            targetRevision: 0.18.3
            namespace: node-feature-discovery
          - name: intel-operator
            repoURL: https://intel.github.io/helm-charts
            chart: intel-device-plugins-operator
            targetRevision: 0.37.1
            namespace: intel-operator
          - name: intel-operator-gpu
            repoURL: https://intel.github.io/helm-charts
            chart: intel-device-plugins-gpu
            targetRevision: 0.37.1
            namespace: intel-operator
          - name: nvidia-device-plugin
            repoURL: https://nvidia.github.io/k8s-device-plugin
            chart: nvidia-device-plugin
            targetRevision: 0.20.1
            namespace: nvidia-device-plugin
          # NOTE: bumping this chart restarts postgres — the cnpg operator
          # rolls managed Cluster instances (primary switchover + replica
          # restarts) whenever its own version changes. Plan upgrades for a
          # window where a brief postgres restart is acceptable.
          - name: cloudnativepg
            repoURL: https://cloudnative-pg.github.io/charts
            chart: cloudnative-pg
            targetRevision: 0.29.1
            namespace: cnpg-system
          - name: plugin-barman-cloud
            repoURL: https://cloudnative-pg.github.io/charts
            chart: plugin-barman-cloud
            targetRevision: 0.8.1
            namespace: cnpg-system
          - name: redis-operator
            repoURL: https://ot-container-kit.github.io/helm-charts/
            chart: redis-operator
            targetRevision: 0.27.0
            namespace: ov
          - name: temporal
            repoURL: https://go.temporal.io/helm-charts
            chart: temporal
            targetRevision: 1.7.0
            namespace: temporal
            project: apps
          - name: kube-prometheus-stack
            repoURL: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            targetRevision: 88.6.5
            namespace: monitoring
          - name: opentelemetry-collector
            repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
            chart: opentelemetry-collector
            targetRevision: 0.178.1
            namespace: monitoring
          - name: tempo
            repoURL: https://grafana.github.io/helm-charts
            chart: tempo
            targetRevision: 1.24.4
            namespace: monitoring
          - name: loki
            repoURL: https://grafana.github.io/helm-charts
            chart: loki
            targetRevision: 7.5.0
            namespace: monitoring
          - name: snmp-exporter
            repoURL: https://prometheus-community.github.io/helm-charts
            chart: prometheus-snmp-exporter
            targetRevision: 9.19.0
            namespace: monitoring
          - name: alloy
            repoURL: https://grafana.github.io/helm-charts
            chart: alloy
            targetRevision: 1.15.0
            namespace: monitoring
          - name: litellm
            repoURL: ghcr.io/berriai
            chart: litellm-helm
            targetRevision: 1.100.0
            namespace: litellm
            project: apps
          - name: technitium-operator
            repoURL: ghcr.io/charg/charts
            chart: technitium-operator
            targetRevision: 1.4.0
            namespace: technitium
          - name: home-assistant
            repoURL: https://pajikos.github.io/home-assistant-helm-chart/
            chart: home-assistant
            targetRevision: 0.3.89
            namespace: home-assistant
            project: apps
          - name: pod-gateway
            repoURL: https://angelnu.github.io/helm-charts/
            chart: pod-gateway
            targetRevision: 7.1.1
            namespace: media
            respectIgnoreDifferences: true
            ignoreDifferences:
              - group: admissionregistration.k8s.io
                kind: MutatingWebhookConfiguration
                jqPathExpressions:
                  - .webhooks[].clientConfig.caBundle
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      # Elements default to infra; workloads set project: apps.
      project: '{{ dig "project" "infra" . }}'
      destination:
        namespace: "{{ .namespace }}"
        server: https://kubernetes.default.svc
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            valueFiles:
              - "$values/kube/nuc01/{{ .name }}/values.yaml"
        - repoURL: https://github.com/Charg/home.git
          targetRevision: main
          ref: values
  templatePatch: |
    spec:
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            skipCrds: {{ dig "helm_skip_crds" "false" . }}
            valueFiles:
              - "$values/kube/nuc01/{{ .name }}/values.yaml"
        - repoURL: https://github.com/Charg/home.git
          targetRevision: main
          ref: values
      syncPolicy:
        automated:
          enabled: {{ dig "auto_sync" "true" . }}
          prune: {{ dig "prune" "true" . }}
          selfHeal: {{ dig "selfHeal" "true" . }}
        syncOptions:
          - CreateNamespace={{ dig "createNamespace" "true" . }}
          - ServerSideApply={{ dig "serverSideApply" "true" . }}
          - RespectIgnoreDifferences={{ dig "respectIgnoreDifferences" "false" . }}
      {{- with dig "ignoreDifferences" (list) . }}
      ignoreDifferences:
      {{- toYaml . | nindent 6 }}
      {{- end }}
