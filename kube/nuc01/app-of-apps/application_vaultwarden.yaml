---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: ghcr.io/charg/charts
    chart: vaultwarden
    targetRevision: 0.3.2
    helm:
      valuesObject:
        # Distroless build from Charg/containers: SQLite only, no shell,
        # runs as nonroot (65532).
        image:
          repository: ghcr.io/charg/containers/vaultwarden
          tag: 1.37.5-3734789a9a4d
          digest: sha256:bdc9fdca6c9fae7a5f9bdbb10a63db83d3a0b37a1db822b19da500c1f97bcefc
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        # Only traefik-internal reaches it; egress is DNS only (no SMTP,
        # push or icon downloads).
        networkPolicy:
          enabled: true
          ingressFrom:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: traefik-internal
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
          restrictEgress: true
        domain: https://vault.home.packet.fail
        signups:
          allowed: false
        invitations:
          allowed: true
        env:
          DISABLE_ICON_DOWNLOAD: "true"
        persistence:
          existingClaim: vaultwarden-data
        ingress:
          enabled: true
          className: traefik-internal
          annotations:
            external-dns.kubernetes.io/hostname: vault.home.packet.fail
          hosts:
            - host: vault.home.packet.fail
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - vault.home.packet.fail
  destination:
    namespace: vaultwarden
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
