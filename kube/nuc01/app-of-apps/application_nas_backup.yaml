---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nas-backup
  namespace: argocd
spec:
  # infra, not apps: the NFS PersistentVolume is cluster-scoped
  project: infra
  source:
    repoURL: https://github.com/Charg/home.git
    path: kube/nuc01/nas-backup
    targetRevision: main
    plugin: {}
  destination:
    namespace: backup
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
