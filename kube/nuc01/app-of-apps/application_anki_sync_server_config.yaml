---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anki-sync-server-config
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/Charg/home.git
    path: kube/nuc01/anki-sync-server-config
    targetRevision: main
    plugin: {}
  destination:
    namespace: anki
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
