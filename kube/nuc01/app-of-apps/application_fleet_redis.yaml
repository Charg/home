---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-redis
  namespace: argocd
  annotations:
    # Wave 1, alongside fleet-mysql; see application_fleet_mysql.yaml
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: apps
  source:
    repoURL: https://github.com/Charg/home.git
    path: kube/nuc01/fleet-redis
    targetRevision: main
    plugin: {}
  destination:
    namespace: fleet
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
