---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synologi-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/SynologyOpenSource/synology-csi.git
      path: deploy/helm
      targetRevision: v1.1.3
      helm:
        releaseName: synology-csi
        valueFiles:
          - "$values/kube/nuc01/synologi-csi/values.yaml"
    - repoURL: https://github.com/Charg/home.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Charg/home.git
      path: kube/nuc01/synologi-csi-config
      targetRevision: main
      plugin: {}
  destination:
    namespace: synologi-csi
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
