---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/Charg/home.git
    path: kube/nuc01/mcp-grafana
    targetRevision: main
    plugin: {}
  destination:
    namespace: ai
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
