---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyparty-public
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/hostname: copycopy.packet.fail
    # Without a target, external-dns would publish the LB's LAN address.
    external-dns.alpha.kubernetes.io/target: 47.150.124.53
    # DNS-only: through the Cloudflare proxy the client IP copyparty sees is
    # Cloudflare's, and bulk video breaks their terms.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: traefik-public
  rules:
    - host: copycopy.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyparty
                port:
                  number: 3923
  tls:
    - hosts:
        - copycopy.packet.fail
      secretName: copyparty-tls
