---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyparty-public
  namespace: media
  annotations:
    external-dns.kubernetes.io/hostname: copycopy.packet.fail
    # A hostname, so external-dns makes a CNAME and no IP is in git.
    # Without a target it would publish the LB's LAN address.
    external-dns.kubernetes.io/target: wan.packet.fail
    # DNS-only: through the Cloudflare proxy the client IP copyparty sees is
    # Cloudflare's, and bulk video breaks their terms.
    external-dns.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: traefik-public
  rules:
    - host: copycopy.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyparty
                port:
                  number: 3923
  tls:
    - hosts:
        - copycopy.packet.fail
      secretName: copyparty-tls
