---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: copyparty
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: copyparty
  policyTypes:
    - Ingress
    - Egress
  # Only the public Traefik. copyparty calls out to nothing, so no egress.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3923
  egress: []
