---
# CrowdSec bouncer (plugin declared in kube/nuc01/traefik-public). Fails open:
# if LAPI is unreachable, traffic is served rather than blocked.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: traefik-public
spec:
  plugin:
    bouncer:
      enabled: true
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /etc/traefik/crowdsec/BOUNCER_KEY_traefik
      updateIntervalSeconds: 60
      updateMaxFailure: -1
      streamStartupBlock: false
