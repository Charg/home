# source: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-public

# Routes that aren't public need the ip-allowlist middleware.
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

metrics:
  prometheus:
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# JSON to stdout for Loki. ClientHost is the real client address (see the
# Service below), which is what copyparty's allowlist checks.
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
      # Read by CrowdSec's bad-user-agent scenario.
      names:
        User-Agent: keep
    # copyparty accepts ?pw= in the URL; keep secrets out of the log.
    queryParameters:
      defaultMode: drop

# CrowdSec bouncer; the Middleware and its LAPI key are in
# traefik-public-config.
experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.2

volumes:
  - name: crowdsec-bouncer-key
    mountPath: /etc/traefik/crowdsec
    type: secret

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-public
    # For the forward-auth middleware in auth (kube/nuc01/tinyauth).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-public

# Two pods on separate nodes; the LB address only routes to the node that
# holds a ready pod, so no SNAT and apps see the real client address.
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-public-traefik-public
        topologyKey: kubernetes.io/hostname

service:
  spec:
    externalTrafficPolicy: Local

# Dashboard only on the traefik entrypoint, which the LoadBalancer doesn't
# expose. traefik-internal routes to it (see traefik-public-config).
ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["traefik"]
    matchRule: PathPrefix(`/dashboard`) || PathPrefix(`/api`)
