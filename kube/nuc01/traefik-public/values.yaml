# source: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-public

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-public
    # For the forward-auth middleware in auth (kube/nuc01/tinyauth).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-public

service:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: traefik-public.home.packet.fail

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["websecure"]
    matchRule: Host(`traefik-public.home.packet.fail`)
    middlewares:
      - name: tinyauth
        namespace: auth
    # Per-router certificate rather than a TLSStore: Traefik allows one
    # "default" store cluster-wide, and traefik-internal owns it.
    tls:
      secretName: home-packet-fail-wildcard-tls
