# source: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-public

metrics:
  prometheus:
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# JSON to stdout for Loki. ClientHost is the real client address (see the
# Service below), which is what copyparty's allowlist checks.
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
    # copyparty accepts ?pw= in the URL; keep secrets out of the log.
    queryParameters:
      defaultMode: drop

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-public
    # For the forward-auth middleware in auth (kube/nuc01/tinyauth).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-public

# Two pods on separate nodes; the LB address only routes to the node that
# holds a ready pod, so no SNAT and apps see the real client address.
deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-public-traefik-public
        topologyKey: kubernetes.io/hostname

service:
  spec:
    externalTrafficPolicy: Local
  annotations:
    external-dns.kubernetes.io/hostname: traefik-public.home.packet.fail

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["websecure"]
    matchRule: Host(`traefik-public.home.packet.fail`)
    middlewares:
      - name: tinyauth
        namespace: auth
    # Per-router certificate rather than a TLSStore: Traefik allows one
    # "default" store cluster-wide, and traefik-internal owns it.
    tls:
      secretName: home-packet-fail-wildcard-tls
