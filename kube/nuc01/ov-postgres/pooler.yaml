---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: ov-postgres-pooler
spec:
  cluster:
    name: ov-postgres
  instances: 1
  type: rw
  monitoring:
    enablePodMonitor: true
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "100"
      default_pool_size: "10"
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
