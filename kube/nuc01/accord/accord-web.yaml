---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accord-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: apps
  source:
    repoURL: ghcr.io/charg/charts
    chart: accord
    targetRevision: 0.21.2
    helm:
      valuesObject:
        image:
          tag: 0.21.2
        imagePullSecrets:
          - name: ghcr-pull-creds
        existingSecret: accord-env
        migrations:
          enabled: false
        worker:
          enabled: false
        registerSchedules:
          enabled: false
        web:
          enabled: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        ingress:
          enabled: true
          className: traefik-internal
          annotations:
            external-dns.alpha.kubernetes.io/hostname: accord.home.packet.fail
          hosts:
            - host: accord.home.packet.fail
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - accord.home.packet.fail
  destination:
    namespace: ac
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
