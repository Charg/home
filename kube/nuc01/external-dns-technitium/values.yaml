# source: https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml
# Publishes home.packet.fail hostnames to Technitium via the technitium-operator webhook sidecar.
# source: https://github.com/Charg/technitium-kube-operator#externaldns-webhook

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/charg/technitium-kube-operator
      tag: 1.3.0
    args:
      - external-dns-webhook
      - --server-ref=dns
      - --zone=home.packet.fail
      - --namespace=technitium
      - --owner-id=nuc01

sources:
  - ingress
  - service

domainFilters:
  - home.packet.fail

policy: sync
# The operator is the only writer to the zone; Records already carry owner labels.
registry: noop
