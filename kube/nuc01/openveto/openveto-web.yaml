---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openveto-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/charg/charts
    chart: openveto
    targetRevision: 0.3.0
    helm:
      valuesObject:
        image:
          tag: 0.3.0
        imagePullSecrets:
          - name: ghcr-pull-creds
        existingSecret: openveto-env
        migrations:
          enabled: false
        worker:
          enabled: false
        backfillWorker:
          enabled: false
        watermarkCheck:
          enabled: false
        web:
          enabled: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        ingress:
          enabled: true
          className: traefik-internal
          annotations:
            cert-manager.io/cluster-issuer: lets-encrypt-packet-fail
            external-dns.alpha.kubernetes.io/hostname: openveto-nuc01.packet.fail
          hosts:
            - host: openveto-nuc01.packet.fail
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: openveto-nuc01-tls
              hosts:
                - openveto-nuc01.packet.fail
  destination:
    namespace: ov
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
