---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openveto-worker
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/charg/charts
    chart: openveto
    targetRevision: 0.3.0
    helm:
      valuesObject:
        image:
          tag: 0.3.0
        imagePullSecrets:
          - name: ghcr-pull-creds
        existingSecret: openveto-env
        migrations:
          enabled: false
        web:
          enabled: false
        worker:
          enabled: true
          env:
            TEMPORAL_MANAGE_SCHEDULE: 'True'
        backfillWorker:
          enabled: true
        watermarkCheck:
          enabled: true
  destination:
    namespace: ov
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
