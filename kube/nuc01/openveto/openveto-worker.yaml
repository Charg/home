---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openveto-worker
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/charg/charts
    chart: openveto
    targetRevision: 0.20.2
    helm:
      valuesObject:
        image:
          tag: 0.20.2
        imagePullSecrets:
          - name: ghcr-pull-creds
        existingSecret: openveto-env
        env:
          CONGRESS_API_RATE_LIMIT_DELAY: '0.8'
        migrations:
          enabled: false
        web:
          enabled: false
        worker:
          enabled: true
          env:
            TEMPORAL_MANAGE_SCHEDULE: 'True'
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        backfillWorker:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
        watermarkCheck:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
  destination:
    namespace: ov
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
