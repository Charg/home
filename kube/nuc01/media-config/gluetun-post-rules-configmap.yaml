---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-gateway-iptables
  namespace: media
data:
  post-rules.txt: |
    iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE
    iptables -I FORWARD -o wg0 -j ACCEPT
    iptables -A FORWARD -i wg0 -m state --state ESTABLISHED,RELATED -j ACCEPT
    iptables -A INPUT -i eth0 -p udp --dport 4789 -j ACCEPT
    iptables -A INPUT -i vxlan0 -p udp --sport 68 --dport 67 -j ACCEPT
    iptables -A OUTPUT -o vxlan0 -j ACCEPT
