---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-gateway-coredns
  namespace: media
data:
  Corefile: |
    (common) {
        errors
        cache 30
        bind 127.0.0.2
    }

    cluster.local:53 {
        import common
        forward . 10.43.0.10
    }

    10.in-addr.arpa:53 {
        import common
        forward . 10.43.0.10
    }

    168.192.in-addr.arpa:53 {
        import common
        forward . 10.43.0.10
    }

    .:53 {
        import common
        forward . tls://1.1.1.1 tls://1.0.0.1 {
            tls_servername cloudflare-dns.com
        }
    }
