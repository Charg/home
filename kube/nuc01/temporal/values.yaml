# source: https://github.com/temporalio/helm-charts/blob/main/charts/temporal/values.yaml

server:
  replicaCount: 1

  metrics:
    prometheus:
      timerType: histogram
      listenAddress: "0.0.0.0:9090"
    serviceMonitor:
      enabled: true
      interval: 30s
      # Histogram buckets are ~80% of Temporal's series. Keep only those used by
      # the temporal-server Grafana dashboard; _sum/_count are kept for the rest.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: (service_latency|persistence_latency|client_latency|memory_gc_pause_ms)_bucket
          targetLabel: __tmp_keep
          replacement: "true"
        - sourceLabels: [__name__, __tmp_keep]
          regex: .+_bucket;
          action: drop
        - regex: __tmp_keep
          action: labeldrop

  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: temporal-postgres-rw:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres-credentials
            secretKey: password
            createDatabase: false
            manageSchema: true
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-postgres-rw:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres-credentials
            secretKey: password
            createDatabase: false
            manageSchema: true
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h

    namespaces:
      create: true
      namespace:
        - name: ov
          retention: 3d
        - name: ac
          retention: 3d

  frontend:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    additionalEnv:
      - name: GOMEMLIMIT
        value: "410MiB" # ~80% of the memory limit above

  history:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 768Mi
    additionalEnv:
      - name: GOMEMLIMIT
        value: "614MiB" # ~80% of the memory limit above

  matching:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    additionalEnv:
      - name: GOMEMLIMIT
        value: "410MiB" # ~80% of the memory limit above

  worker:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    additionalEnv:
      - name: GOMEMLIMIT
        value: "205MiB" # ~80% of the memory limit above

web:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  ingress:
    enabled: true
    className: traefik-internal
    annotations:
      external-dns.alpha.kubernetes.io/hostname: temporal.home.packet.fail
    hosts:
      - "temporal.home.packet.fail/"
    tls:
      - hosts:
          - temporal.home.packet.fail
