---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ov-media-proxy
  namespace: ov
  annotations:
    external-dns.kubernetes.io/hostname: ov-media.home.packet.fail
    traefik.ingress.kubernetes.io/router.middlewares: auth-tinyauth@kubernetescrd
spec:
  ingressClassName: traefik-internal
  rules:
    - host: ov-media.home.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ov-media-proxy
                port:
                  number: 8080
  tls:
    - hosts:
        - ov-media.home.packet.fail
