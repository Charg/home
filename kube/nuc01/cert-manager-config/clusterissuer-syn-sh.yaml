---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt-syn-sh
spec:
  acme:
    email: chris@syn.sh
    privateKeySecretRef:
      name: lets-encrypt-syn-sh
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - selector:
          dnsZones:
            - syn.sh
        dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cert-manager-dns-cloudflare-syn-sh
