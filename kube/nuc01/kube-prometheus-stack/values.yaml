# source: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

grafana:
  initChownData:
    enabled: false
  securityContext:
    fsGroup: 472
    runAsUser: 472
    runAsGroup: 472
  adminUser: admin
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 768Mi
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    annotations:
      external-dns.alpha.kubernetes.io/hostname: grafana.home.packet.fail
    hosts:
      - grafana.home.packet.fail
    tls:
      - hosts:
          - grafana.home.packet.fail
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        tracesToMetricsEnabled: true
        tracesToMetrics:
          datasourceUid: prometheus
        tracesToLogsV2:
          datasourceUid: loki
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      temporal-server:
        gnetId: 20528
        revision: 2
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      cloudflared:
        gnetId: 24874
        revision: 4
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      ac-postgres-slow-queries:
        json: |-
          {
            "title": "ac-postgres Slow Queries",
            "uid": "ac-postgres-slow-queries",
            "tags": ["postgresql", "ac-postgres", "cnpg"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "30s",
            "time": { "from": "now-6h", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Mean Execution Time by Query (top 10)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "fieldConfig": {
                  "defaults": { "unit": "s" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, cnpg_pg_stat_statements_mean_exec_seconds)",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Time Spent Executing, by Query (top 10, rate)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "fieldConfig": {
                  "defaults": { "unit": "percentunit" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, rate(cnpg_pg_stat_statements_total_exec_seconds[5m]))",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Query Call Rate (top 10)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "fieldConfig": {
                  "defaults": { "unit": "reqps" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, rate(cnpg_pg_stat_statements_calls[5m]))",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Rows Returned/Affected Rate (top 10)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "fieldConfig": {
                  "defaults": { "unit": "short" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, rate(cnpg_pg_stat_statements_rows[5m]))",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 5,
                "title": "Slow Query Log Rate (>= 250ms)",
                "type": "timeseries",
                "datasource": { "type": "loki", "uid": "loki" },
                "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
                "fieldConfig": {
                  "defaults": { "unit": "short" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "list", "placement": "bottom" },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "sum(rate({namespace=\"ac\", pod=~\"ac-postgres-[0-9]+\"} |= \"duration:\" [1m]))",
                    "legendFormat": "slow queries/sec",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 6,
                "title": "Slow Query Log Lines",
                "type": "logs",
                "datasource": { "type": "loki", "uid": "loki" },
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
                "options": {
                  "showTime": true,
                  "sortOrder": "Descending",
                  "enableLogDetails": true,
                  "dedupStrategy": "none",
                  "wrapLogMessage": true
                },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "{namespace=\"ac\", pod=~\"ac-postgres-[0-9]+\"} |= \"duration:\"",
                    "refId": "A"
                  }
                ]
              }
            ]
          }

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    annotations:
      external-dns.alpha.kubernetes.io/hostname: prometheus.home.packet.fail
    hosts:
      - prometheus.home.packet.fail
    paths:
      - /api/v1/write
    pathType: Exact
    tls:
      - hosts:
          - prometheus.home.packet.fail
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    retention: 15d
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        cpu: 500m
        memory: 1536Mi
    enableRemoteWriteReceiver: true
    enableOTLPReceiver: true
    otlp:
      promoteResourceAttributes:
        - service.name
        - service.namespace
        - service.instance.id
        - deployment.environment.name
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: kube-etcd
        static_configs:
          - targets:
              - 192.168.74.120:2381
              - 192.168.74.11:2381
              - 192.168.74.12:2381

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

kubeEtcd:
  service:
    enabled: false
  serviceMonitor:
    enabled: false

nodeExporter:
  enabled: true

prometheus-node-exporter:
  # On-demand nodes (tortuga) already push host metrics via Alloy
  # (nix/common/alloy.nix) and would show up as TargetDown whenever they're off.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: home.packet.fail/on-demand
                operator: DoesNotExist
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  admissionWebhooks:
    patch:
      enabled: false
    certManager:
      enabled: true
      issuerRef:
        name: selfsigned
        kind: ClusterIssuer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Extra rules for the NixOS workstations (framework13, tortuga) that push via
# Alloy (nix/common/alloy.nix). Workstations are the node-exporter instances
# labelled with a hostname rather than ip:port. Disk-fill prediction, failed
# systemd units and memory utilisation are already covered by the bundled
# node-exporter rules.
additionalPrometheusRulesMap:
  home-workstations:
    groups:
      - name: home-workstations
        rules:
          - alert: WorkstationCPUHot
            expr: |
              max by (instance) (
                node_hwmon_temp_celsius{job="node-exporter", instance!~".+:[0-9]+", chip="pci0000:00_0000:00:18_3", sensor="temp1"}
              ) > 95
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} CPU at {{ $value | humanize }}°C"
              description: "AMD Tctl has been above 95°C for 5 minutes; the CPU is at or near its throttle point."
          - alert: WorkstationMemoryPressure
            expr: |
              rate(node_pressure_memory_waiting_seconds_total{job="node-exporter", instance!~".+:[0-9]+"}[5m]) > 0.10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} stalled on memory {{ $value | humanizePercentage }} of the time"
              description: "Tasks have spent over 10% of wall time waiting on memory for 10 minutes; expect sluggishness or OOM kills."
          - alert: WorkstationOOMKill
            expr: |
              increase(node_vmstat_oom_kill{job="node-exporter", instance!~".+:[0-9]+"}[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} OOM killer fired"
              description: "The kernel OOM killer terminated a process in the last 15 minutes. Check the journal for the victim."
          - alert: WorkstationNVMeHot
            expr: |
              node_hwmon_temp_celsius{job="node-exporter", instance!~".+:[0-9]+", chip=~"nvme_.+", sensor="temp1"} > 70
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.chip }} at {{ $value | humanize }}°C"
              description: "NVMe composite temperature above 70°C for 15 minutes; sustained heat shortens drive life and causes throttling."
      - name: home-smart
        rules:
          - alert: DiskSmartFailed
            expr: smartctl_device_smart_status{job="smartctl"} != 1
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.device }} failed its SMART health check"
              description: "The drive reports overall SMART status FAILED. Back up now and plan a replacement."
          - alert: NVMeCriticalWarning
            expr: smartctl_device_critical_warning{job="smartctl"} > 0
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.device }} raised an NVMe critical warning ({{ $value }})"
              description: "Bitfield: 1 spare low, 2 temperature, 4 reliability degraded, 8 read-only, 16 volatile backup failed."
          - alert: NVMeSpareLow
            expr: |
              smartctl_device_available_spare{job="smartctl"}
                <= on (instance, device) smartctl_device_available_spare_threshold{job="smartctl"}
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.device }} spare blocks at {{ $value }}%"
              description: "Available spare is at or below the manufacturer threshold; the drive is near end of life."
          - alert: NVMeWearHigh
            expr: smartctl_device_percentage_used{job="smartctl"} >= 80
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.device }} is {{ $value }}% through its rated endurance"
              description: "Percentage used is a vendor estimate of consumed write endurance. Plan a replacement before 100%."
          - alert: DiskMediaErrors
            expr: increase(smartctl_device_media_errors{job="smartctl"}[1h]) > 0
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.device }} logged new media errors"
              description: "Unrecovered data integrity errors increased in the last hour."
