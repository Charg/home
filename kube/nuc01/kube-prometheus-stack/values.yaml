# source: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

grafana:
  initChownData:
    enabled: false
  securityContext:
    fsGroup: 472
    runAsUser: 472
    runAsGroup: 472
  adminUser: admin
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 768Mi
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt-packet-fail
      external-dns.alpha.kubernetes.io/hostname: grafana-nuc01.packet.fail
    hosts:
      - grafana-nuc01.packet.fail
    tls:
      - secretName: grafana-nuc01-tls
        hosts:
          - grafana-nuc01.packet.fail
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        tracesToMetricsEnabled: true
        tracesToMetrics:
          datasourceUid: prometheus
        tracesToLogsV2:
          datasourceUid: loki
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      temporal-server:
        gnetId: 20528
        revision: 2
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      cloudflared:
        gnetId: 24874
        revision: 4
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      ac-postgres-slow-queries:
        json: |-
          {
            "title": "ac-postgres Slow Queries",
            "uid": "ac-postgres-slow-queries",
            "tags": ["postgresql", "ac-postgres", "cnpg"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "30s",
            "time": { "from": "now-6h", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Mean Execution Time by Query (top 10)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "fieldConfig": {
                  "defaults": { "unit": "s" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, cnpg_pg_stat_statements_mean_exec_seconds)",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Time Spent Executing, by Query (top 10, rate)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "fieldConfig": {
                  "defaults": { "unit": "percentunit" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, rate(cnpg_pg_stat_statements_total_exec_seconds[5m]))",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Query Call Rate (top 10)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "fieldConfig": {
                  "defaults": { "unit": "reqps" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, rate(cnpg_pg_stat_statements_calls[5m]))",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Rows Returned/Affected Rate (top 10)",
                "type": "timeseries",
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "fieldConfig": {
                  "defaults": { "unit": "short" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "topk(10, rate(cnpg_pg_stat_statements_rows[5m]))",
                    "legendFormat": "{{query}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 5,
                "title": "Slow Query Log Rate (>= 250ms)",
                "type": "timeseries",
                "datasource": { "type": "loki", "uid": "loki" },
                "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
                "fieldConfig": {
                  "defaults": { "unit": "short" },
                  "overrides": []
                },
                "options": {
                  "legend": { "displayMode": "list", "placement": "bottom" },
                  "tooltip": { "mode": "multi" }
                },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "sum(rate({namespace=\"ac\", pod=~\"ac-postgres-[0-9]+\"} |= \"duration:\" [1m]))",
                    "legendFormat": "slow queries/sec",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 6,
                "title": "Slow Query Log Lines",
                "type": "logs",
                "datasource": { "type": "loki", "uid": "loki" },
                "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
                "options": {
                  "showTime": true,
                  "sortOrder": "Descending",
                  "enableLogDetails": true,
                  "dedupStrategy": "none",
                  "wrapLogMessage": true
                },
                "targets": [
                  {
                    "datasource": { "type": "loki", "uid": "loki" },
                    "expr": "{namespace=\"ac\", pod=~\"ac-postgres-[0-9]+\"} |= \"duration:\"",
                    "refId": "A"
                  }
                ]
              }
            ]
          }

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    retention: 15d
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        cpu: 500m
        memory: 1536Mi
    enableRemoteWriteReceiver: true
    enableOTLPReceiver: true
    otlp:
      promoteResourceAttributes:
        - service.name
        - service.namespace
        - service.instance.id
        - deployment.environment.name
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  admissionWebhooks:
    patch:
      enabled: false
    certManager:
      enabled: true
      issuerRef:
        name: selfsigned
        kind: ClusterIssuer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
