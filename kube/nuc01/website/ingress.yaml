---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: website
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-public-security-headers@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: syn.sh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 8080
  tls:
    - hosts:
        - syn.sh
      secretName: website-tls
