---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
  labels:
    app.kubernetes.io/name: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          # Digest bumped by Renovate on every Charg/website build; see README.
          image: ghcr.io/charg/website:main@sha256:ff55778696a555aab680ab62c437cb5af934ce59b28be1bd746610f1ea9e3105
          args:
            # PROXY headers accepted from in-cluster peers only.
            - -trusted-proxies=10.42.0.0/16
            - -max-conns-per-ip=32
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: GOMEMLIMIT, value: 100MiB }
          ports:
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: health, containerPort: 8081, protocol: TCP }
          volumeMounts:
            # No subPath: the server picks up renewed certificates.
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: tls
          secret:
            secretName: website-tls
            defaultMode: 0440
