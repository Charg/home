---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: website
  namespace: website
  annotations:
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`syn.sh`)
      services:
        - name: website
          port: 8443
          serversTransport: website
  tls:
    passthrough: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: website
  namespace: website
spec:
  proxyProtocol:
    version: 2
