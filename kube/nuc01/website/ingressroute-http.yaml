---
# Plain HTTP for ip.syn.sh, so `curl ip.syn.sh` works. Everything else on
# web redirects to HTTPS.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: website-ip-http
  namespace: website
spec:
  ingressClassName: traefik-public
  entryPoints:
    - web
  routes:
    - match: Host(`ip.syn.sh`)
      kind: Rule
      middlewares:
        - name: crowdsec
          namespace: traefik-public
      services:
        - name: website
          port: 8080
