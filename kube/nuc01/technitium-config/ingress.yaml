---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dns
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-packet-fail
    external-dns.alpha.kubernetes.io/hostname: technitium.home.packet.fail
spec:
  ingressClassName: traefik-internal
  rules:
    - host: technitium.home.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dns-primary
                port:
                  name: api
  tls:
    - hosts:
        - technitium.home.packet.fail
      secretName: technitium-home-tls
