---
# LAPI: agents, the traefik-public bouncer, and metrics scraping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 6060
---
# Agent: metrics scraping only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-agent
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 6060
