# Static NFS volume for the NAS home folder being backed up. server and path
# are sops-encrypted to keep the account name out of the public repo; edit
# with `sops`. The DSM NFS rule on the share is read-only, maps root to admin,
# and allows mounting subfolders.
apiVersion: v1
kind: PersistentVolume
metadata:
    name: nas-backup-data
spec:
    accessModes:
        - ReadOnlyMany
    capacity:
        storage: 1Gi
    claimRef:
        apiVersion: v1
        kind: PersistentVolumeClaim
        name: nas-backup-data
        namespace: backup
    mountOptions:
        - nfsvers=4.1
    nfs:
        server: ENC[AES256_GCM,data:roh9TbnEGL1C/3xvLg==,iv:IDxltKIv3Ht73oMef0Ru4Ufz3cJhuTfR8rDOwsgPMC0=,tag:yyLFm6we1FfBNwaaT6na1Q==,type:str]
