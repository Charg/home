---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-rustfs
  namespace: backup
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backup-rustfs
  template:
    metadata:
      labels:
        app: backup-rustfs
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          ports:
            - containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
            - name: RUSTFS_OBS_ENDPOINT
              value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
            - name: RUSTFS_OBS_SERVICE_NAME
              value: "backup-rustfs"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            # Loopback only; reach it with kubectl port-forward when needed.
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "127.0.0.1:9001"
          # The image already runs as its own user; make that explicit and
          # take away everything else.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
