---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitmagnet
  namespace: media
  labels:
    app.kubernetes.io/name: bitmagnet
spec:
  replicas: 1
  # One crawler per index; never two overlapping during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bitmagnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitmagnet
        # Routes non-cluster egress through the WireGuard gateway. See
        # kube/nuc01/media-config/README.md.
        setGateway: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitmagnet
          image: ghcr.io/charg/bitmagnet:sha-1ec38a8@sha256:b02b8fb11ef4e72b5ecb485343bf5efc24d76f198c14c3a9bf4d113fb85d2d86
          args:
            - worker
            - run
            - --keys=http_server
            - --keys=queue_server
            - --keys=dht_crawler
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_HOST
              value: bitmagnet-postgres-rw
            - name: POSTGRES_NAME
              value: bitmagnet
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bitmagnet-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitmagnet-postgres-credentials
                  key: password
            # Optional: without it bitmagnet falls back to its built-in shared
            # key, which is heavily rate limited.
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bitmagnet-secrets
                  key: tmdb-api-key
                  optional: true
            # Upstream default is 10. Shares the gateway; see README.md.
            - name: DHT_CRAWLER_SCALING_FACTOR
              value: "15"
            # Upstream default is 6s. Most fetches fail, and a failure usually
            # holds its slot for the full timeout.
            - name: METAINFO_REQUESTER_REQUEST_TIMEOUT
              value: 4s
            # Fork default is 100, which throttled crawling ~4x here. 600 matches
            # the crawler's own limit (40 x scaling factor) and the VPN handles it.
            - name: METAINFO_REQUESTER_MAX_CONCURRENT_CONNECTIONS
              value: "600"
            # classifier.yml is read from $XDG_CONFIG_HOME/bitmagnet.
            - name: XDG_CONFIG_HOME
              value: /etc/xdg
            - name: CLASSIFIER_WORKFLOW
              value: filtered
          ports:
            - name: http
              containerPort: 3333
              protocol: TCP
            - name: dht
              containerPort: 3334
              protocol: UDP
          volumeMounts:
            - name: classifier
              mountPath: /etc/xdg/bitmagnet
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Migrations run before the HTTP server binds; give a large index time.
          startupProbe:
            tcpSocket:
              port: 3333
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status
              port: 3333
            periodSeconds: 10
          # TCP, not /status: a Postgres blip should not restart the crawler.
          livenessProbe:
            tcpSocket:
              port: 3333
            periodSeconds: 20
      volumes:
        - name: classifier
          secret:
            secretName: bitmagnet-classifier
