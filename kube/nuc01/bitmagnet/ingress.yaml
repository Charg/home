---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitmagnet-internal
  namespace: media
  annotations:
    external-dns.kubernetes.io/hostname: bitmagnet.home.packet.fail
    traefik.ingress.kubernetes.io/router.middlewares: auth-tinyauth@kubernetescrd
spec:
  ingressClassName: traefik-internal
  rules:
    - host: bitmagnet.home.packet.fail
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitmagnet
                port:
                  number: 3333
  tls:
    - hosts:
        - bitmagnet.home.packet.fail
