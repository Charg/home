# source: https://github.com/kubernetes-sigs/external-dns/blob/master/charts/external-dns/values.yaml

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

provider:
  name: cloudflare

# Public zones only. home.packet.fail is served on the LAN by Technitium (see external-dns-technitium).
domainFilters:
  - packet.fail
  - openveto.com
excludeDomains:
  - home.packet.fail

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: apiKey
