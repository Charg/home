# source: https://github.com/grafana/helm-charts/tree/main/charts/loki

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 72h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 640Mi
    limits:
      cpu: 500m
      memory: 1Gi
  extraEnv:
    - name: GOMEMLIMIT
      value: "800MiB" # ~80% of the memory limit above

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: false

ingress:
  enabled: true
  ingressClassName: traefik-internal
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt-packet-fail
    external-dns.alpha.kubernetes.io/hostname: loki.home.packet.fail
  hosts:
    - loki.home.packet.fail
  paths:
    distributor:
      - /loki/api/v1/push
    queryFrontend: []
    ruler: []
    compactor: []
  tls:
    - secretName: loki-home-tls
      hosts:
        - loki.home.packet.fail

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
